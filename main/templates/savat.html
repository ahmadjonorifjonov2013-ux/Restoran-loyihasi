{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savat — Restoran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
</script>

<header class="site-header">
  <div class="wrap header-row">
    <a href="{% url 'home' %}" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18.5" stroke="#c1922c" stroke-width="1.3"/>
        <path d="M13 24c1-6 4-10 7-13 3 3 6 7 7 13-2 2-5 3-7 3s-5-1-7-3z" fill="#d24a1f"/>
        <path d="M20 11v3" stroke="#c1922c" stroke-width="1.3"/>
      </svg>
      <span class="brand-name">Resto<em>ran</em></span>
    </a>
    <nav class="header-nav">
      <a href="{% url 'home' %}">Bosh sahifa</a>
      <a href="{% url 'menu' %}" id="backToMenu">Menyu</a>
      <a href="{% url 'about' %}">Biz haqimizda</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dark mode">🌙</button>
      <a class="cart-btn" id="cartLink" data-cart-link="{% url 'cart' %}" href="{% url 'cart' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1.4"/><circle cx="17" cy="21" r="1.4"/></svg>
        <span class="cart-label">Savat</span>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Menyu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="section-head reveal" style="justify-content:center;">
      <div>
        <span class="eyebrow">Buyurtma cheki</span>
        <h2>Savatingiz</h2>
      </div>
    </div>
    <div class="receipt" id="receipt">
      <div class="load-note">
        <div class="dot-load"><span></span><span></span><span></span></div><br>
        Yuklanmoqda…
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-grid">
    <div>
      <div class="foot-brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18.5" stroke="#c1922c" stroke-width="1.3"/>
          <path d="M13 24c1-6 4-10 7-13 3 3 6 7 7 13-2 2-5 3-7 3s-5-1-7-3z" fill="#d24a1f"/>
          <path d="M20 11v3" stroke="#c1922c" stroke-width="1.3"/>
        </svg>
        <span class="brand-name">Resto<em>ran</em></span>
      </div>
      <p class="foot-note">Savatingizni tekshirib, buyurtmani bir necha bosishda rasmiylashtiring.</p>
    </div>
    <div class="foot-hours">
      <strong>Ish vaqti</strong>
      <div class="row"><i>Restoran</i> <span>09:00 – 23:00</span></div>
      <div class="row" style="margin-top:6px;"><i>Yetkazish</i> <span>10:00 – 22:30</span></div>
    </div>
  </div>
</footer>

<button class="to-top" type="button" aria-label="Yuqoriga">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="{% static 'core/data.js' %}"></script>
<script src="{% static 'core/cart.js' %}"></script>
<script src="{% static 'core/ui.js' %}"></script>
<script>
let cart = readCartFromURL();

function refreshHeader(){
  renderCartBadge(cart);
  refreshCartLinks(cart);
  const backBtn = document.getElementById('backToMenu');
  if (backBtn) backBtn.setAttribute('href', cartURL("{% url 'menu' %}", cart));
  syncURL(cart);
}

function changeQty(id, delta){
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <= 0) delete cart[id];
  refreshHeader();
  render();
}

function removeLine(id){
  delete cart[id];
  refreshHeader();
  render();
}

function render(){
  const box = document.getElementById('receipt');
  if (!box) return;

  const lines = Object.entries(cart).map(([id, qty])=>{
    let dish = typeof findDish === 'function' ? (findDish(id) || findDish(Number(id))) : null;
    if (!dish && typeof DISHES !== 'undefined') {
      dish = DISHES.find(d => String(d.id) === String(id));
    }
    return dish ? { id, dish, qty } : null;
  }).filter(Boolean);

  if(!lines.length){
    box.innerHTML = `
      <div class="receipt-empty">
        <span class="emo">🥘</span>
        Savat hali bo'sh.<br>Menyudan sevimli taomingizni tanlab qo'shing.<br><br>
        <a href="{% url 'menu' %}" class="btn-primary">Menyuga qaytish</a>
      </div>`;
    return;
  }

  const getPrice = (d) => (typeof field !== 'undefined' && field.dishPrice) ? field.dishPrice(d) : (d.narx || d.price || 0);
  const getName = (d) => (typeof field !== 'undefined' && field.dishName) ? field.dishName(d) : (d.nom || d.name || '');
  const getDesc = (d) => (typeof field !== 'undefined' && field.dishDesc) ? field.dishDesc(d) : (d.tavsif || d.description || d.masalliqlar || '');
  const getImg = (d) => (typeof field !== 'undefined' && field.dishImg) ? field.dishImg(d) : (d.rasm || d.image || d.img || '');

  const total = lines.reduce((s,{dish,qty})=> s + getPrice(dish)*qty, 0);
  const count = lines.reduce((s,{qty})=> s + qty, 0);

  box.innerHTML = `
    <div class="receipt-head">
      <div class="serif">Buyurtma cheki</div>
      <div class="muted">${count} ta taom · ${lines.length} tur</div>
    </div>
    ${lines.map(({id,dish,qty})=>{
      const desc = getDesc(dish);
      const imgSrc = getImg(dish);
      return `
        <div class="receipt-line">
          ${imgSrc ? `<img src="${imgSrc}" alt="${getName(dish)}">` : ''}
          <div class="rl-name">
            <div class="n">${getName(dish)}</div>
            ${desc ? `<div class="u">${desc}</div>` : ''}
            <div class="qty-row">
              <button class="qty-btn" data-dec="${id}">−</button>
              <span class="qty-val">${qty}</span>
              <button class="qty-btn" data-inc="${id}">+</button>
              <button class="remove-line" data-rm="${id}">olib tashlash</button>
            </div>
          </div>
          <div class="rl-total">${fmt(getPrice(dish)*qty)} so'm</div>
        </div>
      `;
    }).join('')}
    <div class="receipt-sum">
      <div class="sum-row"><span>Taomlar narxi</span><span>${fmt(total)} so'm</span></div>
      <div class="sum-row"><span>Yetkazish</span><span>Parchin (bepul)</span></div>
      <div class="sum-row total"><span>Jami</span><span>${fmt(total)} so'm</span></div>
      <a class="btn-primary" style="display:block;text-align:center;width:100%;" id="checkoutLink" data-cart-link="{% url 'checkout' %}" href="{% url 'checkout' %}">Buyurtmani rasmiylashtirish</a>
    </div>
  `;

  box.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.inc,1)));
  box.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>changeQty(b.dataset.dec,-1)));
  box.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>removeLine(b.dataset.rm)));
  refreshCartLinks(cart);
}

refreshHeader();

if (typeof loadMenuData === 'function') {
  loadMenuData().then(()=>{
    refreshHeader();
    render();
  }).catch(()=>{
    render();
  });
} else {
  render();
}

/* MOBILE NAV */
const navBurger = document.getElementById("navBurger");
const siteHeader = document.querySelector(".site-header");
if (navBurger && siteHeader) {
  navBurger.addEventListener("click", () => siteHeader.classList.toggle("nav-open"));
}

/* DARK MODE */
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  if (document.body.classList.contains("dark")) themeToggle.textContent = "☀️";
  themeToggle.addEventListener("click", function () {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    themeToggle.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });
}
</script>
</body>
</html>
