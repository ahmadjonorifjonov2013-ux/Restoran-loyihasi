name: Deploy Restoran Project to VPS

on:
  push:
    branches:
      - main  # Если в вашем репозитории используется ветка master, замените main на master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e  # Если любая команда завершится ошибкой, скрипт сразу остановится
            
            # 1. Переход в папку проекта на VPS
            cd /var/www/ahmadjon.sharqsoft.uz

            # 2. Получение свежего кода из GitHub
            git fetch origin main
            git reset --hard origin/main

            # 3. Активация виртуального окружения и установка зависимостей
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 4. Применение миграций и сборка статических файлов Django
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # 5. Перезапуск служб Gunicorn и Nginx
            sudo systemctl restart gunicorn
            sudo systemctl restart nginx