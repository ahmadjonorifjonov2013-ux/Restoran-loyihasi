{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menyu — Restoran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

<script>
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
</script>

<header class="site-header">
  <div class="wrap header-row">
    <a href="{% url 'home' %}" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18.5" stroke="#d4a94a" stroke-width="1.2"/>
        <path d="M13 24c1-6 4-10 7-13 3 3 6 7 7 13-2 2-5 3-7 3s-5-1-7-3z" fill="#c1440e"/>
        <path d="M20 11v3" stroke="#d4a94a" stroke-width="1.2"/>
      </svg>
      <span class="brand-name">Resto<em>ran</em></span>
    </a>
    <nav class="header-nav">
      <a href="{% url 'home' %}">Bosh sahifa</a>
      <a href="{% url 'menu' %}" class="current">Menyu</a>
      <a href="{% url 'about' %}">Biz haqimizda</a>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dark mode">🌙</button>
      <a class="cart-btn" id="cartLink" data-cart-link="{% url 'cart' %}" href="{% url 'cart' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1.4"/><circle cx="17" cy="21" r="1.4"/></svg>
        Savat
        <span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </div>
</header>

<section class="section" style="padding-top:48px;">
  <div class="wrap">
    <div class="section-head" style="border-bottom:none;margin-bottom:8px;">
      <h2>Menyu</h2>
      <span style="color:var(--muted);font-size:.9rem;" id="dishCount"></span>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="menu-list" id="menuList">
      <div class="load-note">
        <div class="dot-load"><span></span><span></span><span></span></div><br>
        Menyu yuklanmoqda…
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-grid">
    <div>
      <span class="brand-name">Resto<em>ran</em></span>
      <p class="foot-note">Tanlagan taomingiz savatga qo'shiladi, keyin buyurtmani bir necha bosishda rasmiylashtirasiz.</p>
    </div>
    <div class="foot-hours">
      <strong>Ish vaqti</strong>
      Har kuni: 09:00 – 23:00<br>
      Yetkazib berish: 10:00 – 22:30
    </div>
  </div>
</footer>

<script src="{% static 'core/data.js' %}"></script>
<script src="{% static 'core/cart.js' %}"></script>
<script>
let cart = readCartFromURL();
let activeCat = 'all';

function refreshHeader(){
  renderCartBadge(cart);
  refreshCartLinks(cart);
  syncURL(cart);
}

function renderTabs(){
  const row = document.getElementById('catTabs');
  const tabs = [{ _all:true, name:'Barchasi' }, ...CATS];

  row.innerHTML = tabs.map(c => {
    const id = c._all ? 'all' : field.catId(c);
    const name = c._all ? c.name : field.catName(c);
    const active = String(activeCat) === String(id) ? 'active' : '';
    return `<button class="cat-tab ${active}" data-cat="${id}">${name}</button>`;
  }).join('');

  row.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const selectedCat = btn.dataset.cat;
      activeCat = selectedCat === 'all' ? 'all' : selectedCat;
      renderTabs();
      renderList();
    });
  });
}

function renderList(){
  const list = DISHES.filter(d => activeCat === 'all' || String(field.dishCat(d)) === String(activeCat));

  document.getElementById('dishCount').textContent = list.length ? `${list.length} ta taom` : '';
  const wrap = document.getElementById('menuList');

  if(!list.length){
    wrap.innerHTML = `<div class="empty-note">Bu toifada hozircha taom yo'q.</div>`;
    return;
  }

  wrap.innerHTML = list.map((d, i) => {
    const id = field.dishId(d);
    const img = field.dishImg(d);
    const media = img ? `<img src="${img}" alt="${field.dishName(d)}" loading="lazy">` : plateSVG(id);
    const inCart = !!cart[id];

    return `
    <div class="menu-row">
      <div class="no">${String(i + 1).padStart(2, '0')}</div>
      <div class="menu-thumb">${media}</div>
      <div class="menu-info">
        <div class="name">${field.dishName(d)}</div>
        <div class="desc">${field.dishDesc(d)}</div>
      </div>
      <div class="menu-right">
        <div class="price">${fmt(field.dishPrice(d))}<span class="sum"> so'm</span></div>
        <button class="add-btn ${inCart ? 'added' : ''}" data-add="${id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          ${inCart ? `Savatda (${cart[id]})` : "Qo'shish"}
        </button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.add;
      cart[id] = (cart[id] || 0) + 1;
      refreshHeader();
      renderList();
    });
  });
}

loadMenuData().then(() => {
  renderTabs();
  renderList();
  refreshHeader();
}).catch(err => {
  console.error('Menyu yuklashda xatolik:', err);
  document.getElementById('menuList').innerHTML =
    `<div class="empty-note">Menyuni yuklab bo'lmadi. Birozdan so'ng qayta urinib ko'ring.</div>`;
  refreshHeader();
});

const themeToggle = document.getElementById("themeToggle");
if (document.body.classList.contains("dark")) {
  themeToggle.textContent = "☀️";
}
themeToggle.addEventListener("click", function () {
  document.body.classList.toggle("dark");
  const isDark = document.body.classList.contains("dark");
  themeToggle.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});
</script>
</body>
</html>
